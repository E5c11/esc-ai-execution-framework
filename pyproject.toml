[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esc-ai-execution-framework"
version = "0.1.0"
description = "Provider-agnostic execution manifests and tooling for AI-assisted software development"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
esc-exec = "esc_exec.cli:main"

[tool.setuptools.packages.find]
include = ["esc_exec*"]

