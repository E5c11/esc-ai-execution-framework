$schema: https://json-schema.org/draft/2020-12/schema
$id: https://esc.ai/schemas/execution/repository-manifest-v1.schema.yaml
title: ESC AI Repository Manifest
type: object
additionalProperties: false
required: [schema_version, repository, components]
properties:
  schema_version:
    const: 1
  repository:
    type: object
    additionalProperties: false
    required: [id, type]
    properties:
      id: {type: string, minLength: 1}
      type: {type: string, minLength: 1}
      purpose: {type: string, minLength: 1}
  frameworks:
    type: object
    additionalProperties: {type: string, minLength: 1}
  architecture:
    $ref: "#/$defs/architecture"
  components:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, manifest]
      properties:
        id: {type: string, minLength: 1}
        manifest: {type: string, pattern: "(^|/)esc-component\\.yaml$"}
  generation:
    $ref: "#/$defs/generation"
  resolved_components:
    type: object
    description: >-
      Tier 2 AI-resolved component_id -> repository-root-relative directory,
      persisted so a component whose build-configuration identifier Tier 1
      static detection can't resolve on its own (see BuildSystemAdapter.unresolved)
      doesn't need to be re-resolved by AI on every future analyze/apply.
    additionalProperties: {type: string, minLength: 1}
  excluded_components:
    type: array
    description: >-
      Component IDs a human explicitly excluded during onboarding confirmation
      (test fixtures, deprecated modules, ...) -- never re-offered as "create" by
      a future analyze regardless of which tier would otherwise detect them.
    items: {type: string, minLength: 1}
$defs:
  generation:
    type: object
    additionalProperties: false
    required: [generator, sources]
    properties:
      generator: {type: string, minLength: 1}
      sources:
        type: array
        items: {type: string, minLength: 1}
  architecture:
    type: object
    additionalProperties: false
    properties:
      profile_ids:
        type: array
        minItems: 1
        items: {type: string, minLength: 1}

