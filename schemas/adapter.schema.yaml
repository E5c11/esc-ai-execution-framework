$schema: https://json-schema.org/draft/2020-12/schema
$id: https://esc.ai/schemas/execution/adapter-v1.schema.yaml
title: ESC AI Adapter
type: object
additionalProperties: false
required: [schema_version, adapter]
properties:
  schema_version: {const: 1}
  adapter:
    type: object
    additionalProperties: false
    required: [id, kind, provider, capabilities]
    properties:
      id: {type: string, minLength: 1}
      kind: {enum: [agent-runtime, build-system, test-framework, reporter, source-control]}
      provider: {type: string, minLength: 1}
      version: {type: string, minLength: 1}
      capabilities: {type: array, minItems: 1, items: {type: string, minLength: 1}}
      configuration: {type: object}

