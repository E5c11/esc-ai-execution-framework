$schema: https://json-schema.org/draft/2020-12/schema
$id: https://esc.ai/schemas/execution/initiative-v1.schema.yaml
title: ESC AI Initiative
type: object
additionalProperties: false
required: [schema_version, initiative]
properties:
  schema_version:
    const: 1
  initiative:
    type: object
    additionalProperties: false
    required: [id, objective, work_type, tasks]
    properties:
      id: {type: string, minLength: 1}
      objective: {type: string, minLength: 1}
      work_type: {enum: [feature, fix, refactor, maintenance, investigation]}
      tasks:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [repository, task_id]
          properties:
            repository: {type: string, minLength: 1}
            task_id: {type: string, minLength: 1}
            depends_on:
              type: array
              items: {type: string, minLength: 1, pattern: "^[^/]+/[^/]+$"}
