$schema: https://json-schema.org/draft/2020-12/schema
$id: https://esc.ai/schemas/execution/architecture-profile-v1.schema.json
title: ESC AI Architecture Profile
type: object
additionalProperties: false
required: [schema_version, profile, limits, rules]
properties:
  schema_version: {const: 1}
  profile:
    type: object
    additionalProperties: false
    required: [id, component]
    properties:
      id: {type: string, minLength: 1}
      component: {type: string, minLength: 1}
  limits:
    type: object
    additionalProperties: false
    required: [max_violations_per_rule, max_evidence_chars]
    properties:
      max_violations_per_rule: {type: integer, minimum: 1, maximum: 100}
      max_evidence_chars: {type: integer, minimum: 1, maximum: 1000}
  rules:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, type, description]
      properties:
        id: {type: string, pattern: '^[a-z0-9]+([.-][a-z0-9]+)*$'}
        type: {enum: [forbidden-import, forbidden-path, required-path]}
        description: {type: string, minLength: 1}
        source_root: {type: string, minLength: 1}
        patterns: {type: array, minItems: 1, items: {type: string, minLength: 1}}
        paths: {type: array, minItems: 1, items: {type: string, minLength: 1}}
