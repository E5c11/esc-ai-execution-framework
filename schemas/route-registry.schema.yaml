$schema: https://json-schema.org/draft/2020-12/schema
$id: https://esc.ai/schemas/execution/route-registry-v1.schema.yaml
title: ESC AI Machine-local Route Registry
type: object
additionalProperties: false
required: [schema_version, repositories, frameworks]
properties:
  schema_version:
    const: 1
  repositories:
    $ref: "#/$defs/routes"
  frameworks:
    $ref: "#/$defs/routes"
  ecosystems:
    $ref: "#/$defs/ecosystems"
  orchestrator:
    type: object
    additionalProperties: false
    properties:
      endpoint: {type: string, minLength: 1}
  ui:
    type: object
    additionalProperties: true
  credentials:
    type: object
    additionalProperties: false
    properties:
      # A pointer to which credential provider is configured (e.g. "env", a
      # secrets-manager name) -- never an actual secret value. Real secrets belong in
      # the environment or the named provider, not in this file.
      provider: {type: string, minLength: 1}
$defs:
  routes:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: {type: string, minLength: 1}
  ecosystems:
    type: object
    additionalProperties:
      type: object
      additionalProperties: false
      required: [repositories]
      properties:
        repositories:
          type: array
          minItems: 1
          items: {type: string, minLength: 1}

