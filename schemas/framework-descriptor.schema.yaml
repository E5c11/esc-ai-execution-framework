$schema: https://json-schema.org/draft/2020-12/schema
$id: https://esc.ai/schemas/execution/framework-descriptor-v1.schema.yaml
title: ESC AI Framework Descriptor
type: object
additionalProperties: false
required: [schema_version, framework]
properties:
  schema_version:
    const: 1
  framework:
    type: object
    additionalProperties: false
    required: [id, major_version]
    properties:
      id: {type: string, minLength: 1}
      major_version: {type: integer, minimum: 1}
      description: {type: string, minLength: 1}
