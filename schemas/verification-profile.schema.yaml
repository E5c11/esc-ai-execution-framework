$schema: https://json-schema.org/draft/2020-12/schema
$id: https://esc.ai/schemas/execution/verification-profile-v1.schema.json
title: ESC AI Verification Profile
type: object
additionalProperties: false
required: [schema_version, profile, gates]
properties:
  schema_version: {const: 1}
  profile:
    type: object
    additionalProperties: false
    required: [id, component]
    properties:
      id: {type: string, minLength: 1}
      component: {type: string, minLength: 1}
  gates:
    type: object
    additionalProperties: false
    required: [focused, component, impact, final]
    properties:
      focused: {$ref: '#/$defs/checks'}
      component: {$ref: '#/$defs/checks'}
      impact: {$ref: '#/$defs/checks'}
      final: {$ref: '#/$defs/checks'}
$defs:
  checks:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, command]
      properties:
        id: {type: string, minLength: 1}
        command: {type: array, minItems: 1, items: {type: string}}
        requires: {type: array, items: {type: string, minLength: 1}}
        report:
          type: object
          additionalProperties: false
          required: [glob, profile]
          properties:
            glob: {type: string, minLength: 1}
            profile: {type: string, minLength: 1}
