$schema: https://json-schema.org/draft/2020-12/schema
$id: https://esc.ai/schemas/execution/task-specification-v1.schema.yaml
title: ESC AI Task Specification
type: object
additionalProperties: false
required: [schema_version, task, scope, completion_conditions]
properties:
  schema_version: {const: 1}
  task:
    type: object
    additionalProperties: false
    required: [id, title, objective, repository, status]
    properties:
      id: {type: string, minLength: 1}
      title: {type: string, minLength: 1}
      objective: {type: string, minLength: 1}
      repository: {type: string, minLength: 1}
      status: {enum: [draft, ready, active, blocked, complete, cancelled]}
  scope:
    type: object
    additionalProperties: false
    required: [components]
    properties:
      components: {type: array, minItems: 1, items: {type: string, minLength: 1}}
      paths: {type: array, items: {type: string, minLength: 1}}
      related_repositories: {type: array, items: {type: string, minLength: 1}}
  execution:
    type: object
    additionalProperties: false
    properties:
      workspace: {type: string, minLength: 1}
      adapter: {type: string, minLength: 1}
      policy: {type: string, minLength: 1}
  completion_conditions: {type: array, minItems: 1, items: {type: string, minLength: 1}}
  references: {type: array, items: {type: string, minLength: 1}}

