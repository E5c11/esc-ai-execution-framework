$schema: https://json-schema.org/draft/2020-12/schema
$id: https://esc.ai/schemas/execution/workflow-policy-v1.schema.yaml
title: ESC AI Repository Workflow Policy
type: object
additionalProperties: false
required: [schema_version, policy]
properties:
  schema_version:
    const: 1
  policy:
    type: object
    additionalProperties: false
    properties:
      extension:
        type: object
        additionalProperties: false
        properties:
          id: {type: string, minLength: 1}
          precedence: {type: string, minLength: 1}
      final_gates:
        type: array
        items: {type: string, minLength: 1}
      commit_conventions: {type: string, minLength: 1}
